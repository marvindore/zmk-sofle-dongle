name: Draw Keymap
on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "scripts/render_keymap.py"
      - ".github/workflows/draw.yml"
      - keymap_drawer.config.yaml

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install keymap-drawer
        run: pip install keymap-drawer
      - name: Render keymap (SVG + light/dark PNG)
        run: python3 scripts/render_keymap.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keymap-drawer
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "[Draw] ${{ github.event.head_commit.message }}"
            git push
          fi
